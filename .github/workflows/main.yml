name: Python CI

#Trigger the workflow on any push or pr to the man branch


on:
  push:
    branches:[main]
  pull_request:
    branches:[main]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    #check out hte code form teh repo
    - name: check out the code
      uses: actions/checkout@v2



      #step 2: set up the pythn env
      - name : set up python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

    # install dependencies
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # run tests
    - name: run tests
      run: |
        pytest



